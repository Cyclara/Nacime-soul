# CI（持续集成）配置文件
# 依据：S-004 §3.5 CI 门禁
#
# 作用：每次 push 代码或提交 PR 到 main/master 分支时，
# GitHub 云端自动跑以下检查，任一失败则显示红色 ❌ 阻止合并：
#   1. Lint        - 代码风格 0 error
#   2. Typecheck   - 类型检查 0 error
#   3. Test+coverage - 单元/集成/对抗测试全绿 + 覆盖率达标
#   4. Build       - electron-vite 构建通过
#   5. Gate        - phase1-gate：lint/typecheck/test/build + 3 项静态扫描（M-11 补）
#   6. E2E         - Playwright Electron 端到端测试（M-11：门禁，失败即红，不再 continue-on-error）
#   7. Security    - 源码无明文 API key

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26'

      - name: Install dependencies
        run: npm ci
        env:
          # 国内镜像加速 Electron 二进制下载
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      # === 1. Lint：代码风格检查（0 error） ===
      - name: Lint
        run: npm run lint

      # === 2. Typecheck：TypeScript 类型检查（0 error） ===
      - name: Typecheck
        run: npm run typecheck

      # === 3. Test + coverage：单元/集成/对抗测试 + 覆盖率达标 ===
      # test:coverage 跑全部 *.test.ts（含 adversarial.test.ts），
      # 并检查 vitest.config.ts 里的 thresholds（lines 75% / branches 70%）。
      # 注意：该阈值仅覆盖纯逻辑层（见 vitest.config.ts exclude 注释），
      # UI/入口/IPC handler/preload 由 E2E 覆盖，不计入此阈值。
      - name: Test + coverage
        run: npm run test:coverage

      # === 4. Build：electron-vite 构建（生成 out/） ===
      - name: Build
        run: npm run build

      # === 5. Gate：phase1-gate 全量门禁（M-11 补：gate 必须在 CI 中实际运行） ===
      # 前 4 步已覆盖 lint/typecheck/test/build；gate 额外做 3 项静态扫描
      # （源码无明文 key / 构建产物无聊天正文残留 / LogFields 白名单不含聊天正文字段）。
      - name: Gate (phase1-gate)
        run: npm run gate

      # === 6. E2E：Playwright Electron 端到端测试 ===
      # 启动真实 Electron 应用，模拟用户操作（S-004 §3.3 #36/#37）
      # M-11：提升为门禁——E2E 失败即 CI 红，不允许静默合并。
      # （若 CI 上出现偶发失败，优先修复 flaky 根因而非回到 continue-on-error。）
      - name: E2E (Playwright Electron)
        run: npx playwright test

      # === 7. Security scan：源码无明文 API key ===
      # 扫描 src/ 下的 .ts/.vue 文件，确保不含 sk- 开头的明文 API key
      # 依据 S-001 P1-28 验收"磁盘无明文 key"
      - name: Security scan (no plaintext API key)
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            let found = false;
            function walk(dir) {
              for (const f of fs.readdirSync(dir)) {
                const fp = path.join(dir, f);
                const st = fs.statSync(fp);
                if (st.isDirectory()) { walk(fp); continue; }
                if (!/\.(ts|vue)$/.test(f)) continue;
                // 跳过测试文件：测试文件里的 key 是 fixture（假 key），用于测试 scrub 脱敏功能，不是真实 key
                if (/\.test\.ts$/.test(f)) continue;
                const content = fs.readFileSync(fp, 'utf8');
                // 匹配 sk- 后跟可选 proj-/ant-api03- 段 + 至少 16 个 key 字符（含连字符）。
                // 覆盖 OpenAI 旧/新格式（sk-xxx / sk-proj-xxx）与 Anthropic（sk-ant-api03-xxx），
                // 与日志脱敏规则 observability/types.ts 的 /sk-[A-Za-z0-9_-]{8,}/ 对齐（拦截层不弱于脱敏层）。
                const match = content.match(/\bsk-(?:ant-api03-|proj-)?[A-Za-z0-9_-]{16,}/);
                if (match) {
                  console.error('  FAIL: ' + fp + ' 含明文 API key: ' + match[0].slice(0,10) + '...');
                  found = true;
                }
              }
            }
            walk('src');
            if (found) { console.error('安全扫描失败：源码含明文 API key'); process.exit(1); }
            console.log('安全扫描通过：源码无明文 API key');
          "
