appId: com.nacime-soul.app
productName: Nacime-soul
artifactName: '${productName}-${version}-${arch}.${ext}'
directories:
  output: dist-electron
  buildResources: assets
files:
  - out/**
  - package.json
  - resources/prompts/**
  - resources/seeds/**
  - resources/growth/**
  # P3A-11：内置 Mao/Hiyori 模型与随包许可；stage 仅经 nacime-live2d:// 安全读取。
  - resources/live2d/**
  - assets/tray/**
# P3B-18：外部 Python 必须直接读取 launcher/词典，不能放进 app.asar 虚拟文件系统。
# 只复制 Nacime 自有桥接资源；用户的 GPT-SoVITS 整合包与模型绝不进安装包、绝不改写。
extraResources:
  - from: resources/voice
    to: voice
    filter:
      - '**/*'
asar: true
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icon.ico
  # M-10：Windows 代码签名（发布前启用，消除 SmartScreen 警告）。
  # 当前未配置证书 -> 产物不签名。接入方式二选一：
  #   A) 本地证书：取消下面注释，提供 .pfx 路径（密码走环境变量 WIN_CERT_PASSWORD，勿写死）：
  #   certificateFile: path/to/your.pfx
  #   certificatePassword: ${env.WIN_CERT_PASSWORD}
  #   B) Azure Trusted Signing（云端签名，推荐）：
  #   azureSignOptions:
  #     endpoint: https://eus.codesigning.azure.net
  #     certificateProfileName: your-profile
  #     timestampRfc3161: http://timestamp.acs.microsoft.com
  # 签名后请在发布 workflow 中开启 forceCodeSigning 以拒绝未签名产物。
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
npmRebuild: false
# M-50：electron-updater 发布源。与 git remote origin 的公开仓库一致；
# electron-builder 会把该信息写入打包产物 resources/app-update.yml，并为 release 生成 latest.yml。
publish:
  provider: github
  owner: Cyclara
  repo: Nacime-soul
